name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # requirements.txt pins CUDA wheels (~3 GB) a CPU runner never uses: same filtering as the Dockerfile
      - name: Install (CPU torch)
        run: |
          TORCH="$(grep -E '^torch==' requirements.txt | cut -d' ' -f1 | cut -d';' -f1)"
          pip install "$TORCH" --index-url https://download.pytorch.org/whl/cpu
          grep -v -E '^(nvidia-|triton|cuda-|torch==)' requirements.txt > requirements.cpu.txt
          pip install -r requirements.cpu.txt pytest httpx

      - name: Fast tests (stubs, no LLM, no PDF)
        run: pytest -m "not slow" -q

      - name: Cache embedding and reranker models
        uses: actions/cache@v4
        with:
          path: .hf
          key: hf-${{ hashFiles('rag_app/config.py') }}

      - name: Download document.pdf
        run: bash scripts/fetch_document.sh

      - name: Retrieval regression guard (slow tests)
        run: pytest -m slow -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: doc-rag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test /health
        run: |
          docker run -d --name rag -e RAG_SKIP_WARMUP=1 -p 8000:8000 doc-rag:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 2; done
          docker logs rag; exit 1

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/$OWNER/doc-rag"
          docker tag doc-rag:ci "$IMAGE:latest"
          docker tag doc-rag:ci "$IMAGE:${{ github.sha }}"
          docker push --all-tags "$IMAGE"
