[project]
name = "doc-rag"
version = "0.1.0"
description = "Question answering over a PDF: hybrid retrieval, cross-encoder rerank, a LangGraph agent that cites pages and abstains, served with FastAPI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu==1.15.1",
    "fastapi>=0.115",
    "langchain-core>=1.6",
    "langchain-groq==1.1.3",
    "langchain-openai>=1.0",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.12",
    "numpy",
    "pymupdf>=1.28.2",
    "python-dotenv==1.2.3",
    "sentence-transformers==5.7.0",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest>=8",
]
# only needed to re-run the exploration notebooks (RAG.ipynb, workflow.ipynb)
notebooks = [
    "boto3==1.43.103",
    "ipykernel==7.4.0",
    "langchain==1.4.3",
    "langchain-community>=0.4.2",
    "langchain-huggingface==1.2.2",
    "matplotlib==3.11.2",
    "pandas==3.0.6",
    "pypdf==6.19.0",
    "seaborn==0.13.2",
    "transformers==4.57.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rag_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the embedding and reranker models and builds an index (needs document.pdf)",
]
